<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบลงคะแนนเลือกนายกรัฐมนตรี v2 (Interactive)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Sarabun', sans-serif; background-color: #F7D0D3; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 30px; }

.monitor-container { width: 100%; max-width: 1200px; aspect-ratio: 16 / 9; background-color: #F5CBD0; padding: 30px 0; display: flex; flex-direction: column; align-items: center; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
.emblem-wrapper { margin-bottom: 15px; }
.emblem { width: 90px; height: 90px; border-radius: 50%; object-fit: contain; }
.main-title { font-size: 38px; font-weight: 700; color: #1A1A1A; margin-bottom: 35px; letter-spacing: 0.5px; }

/* v2: แสดงชื่อแคนดิเดตที่กำลังลงมติ */
.candidate-line { font-size: 30px; color: #162464; margin-bottom: 25px; text-align: center; padding: 0 30px; }
.candidate-line b { font-weight: 700; color: #D3434B; }

.name-banner { width: 100%; background-color: #162464; color: #FFF; padding: 15px 45px; font-size: 34px; text-align: left; display: flex; align-items: center; height: 80px; }
.vote-section { width: 100%; display: flex; margin-top: 15px; padding: 0 45px; gap: 20px; }
.vote-label { background-color: #EAEAEA; color: #0E29A8; font-size: 32px; font-weight: 700; width: 220px; height: 85px; display: flex; justify-content: center; align-items: center; border-radius: 2px; }
.vote-value-box { background-color: #ECECEC; flex-grow: 1; height: 85px; border-radius: 2px; display: flex; align-items: center; padding-left: 30px; }
.vote-result-text { font-size: 34px; font-weight: 700; }
.text-agree { color: #008000; } .text-disagree { color: #FF0000; } .text-abstain { color: #7F7F7F; }

/* แผงควบคุม */
.control-panel { margin-top: 30px; background: #fff; padding: 20px 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 15px; align-items: center; width: 100%; max-width: 1200px; }
.panel-row { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; width: 100%; }
.panel-title { font-size: 16px; font-weight: bold; color: #555; text-align: center; }
.divider { width: 100%; border-top: 1px solid #e5e5e5; }

.btn { padding: 12px 28px; font-family: inherit; font-size: 18px; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; transition: all .2s; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
.btn:active { transform: scale(0.95); }
.btn-agree { background: #2ecc71; color: #fff; } .btn-agree:hover { background: #27ae60; }
.btn-disagree { background: #e74c3c; color: #fff; } .btn-disagree:hover { background: #c0392b; }
.btn-abstain { background: #95a5a6; color: #fff; } .btn-abstain:hover { background: #7f8c8d; }
.btn-clear { background: #f1c40f; color: #333; } .btn-clear:hover { background: #f39c12; }
.btn-nav { background: #34495e; color: #fff; } .btn-nav:hover { background: #2c3e50; }
.btn-nav:disabled { background: #bdc3c7; cursor: not-allowed; }
.btn-sm { padding: 8px 16px; font-size: 15px; }

/* v2: ตัวเลือกแคนดิเดต */
.chip { padding: 10px 22px; font-family: inherit; font-size: 18px; font-weight: 700; border: 2px solid #162464; border-radius: 999px; background: #fff; color: #162464; cursor: pointer; transition: all .15s; }
.chip:hover { background: #eef0fb; }
.chip.active { background: #162464; color: #fff; }
.add-input { font-family: inherit; font-size: 17px; padding: 8px 14px; border: 1px solid #bbb; border-radius: 6px; width: 320px; max-width: 100%; }

.tally { display: flex; gap: 22px; font-size: 18px; font-weight: 700; flex-wrap: wrap; justify-content: center; }
.cand-tag { display:inline-flex; align-items:center; gap:6px; padding:6px 8px 6px 16px; border:2px solid #162464; border-radius:999px; font-size:17px; font-weight:700; color:#162464; background:#fff; }
.cand-tag button { border:none; background:#eef0fb; border-radius:50%; width:28px; height:28px; cursor:pointer; font-size:14px; }
.cand-tag button:hover { background:#dfe3f7; }
.btn-cand { color:#fff; }
.tally span.a { color: #008000; } .tally span.d { color: #FF0000; } .tally span.b { color: #7F7F7F; } .tally span.n { color: #555; }
</style>
</head>
<body>

<div class="monitor-container">
    <div class="emblem-wrapper">
        <img src="https://i.ibb.co/fG2Q5dfJ/151-20260611155111.png" class="emblem" alt="ตราสัญลักษณ์">
    </div>
    <h1 class="main-title">การลงคะแนนเลือกนายกรัฐมนตรี</h1>

    <div class="name-banner" id="memberName">กำลังโหลดรายชื่อ...</div>

    <div class="vote-section">
        <div class="vote-label">ลงมติ</div>
        <div class="vote-value-box"><div id="voteResult" class="vote-result-text"></div></div>
    </div>
</div>

<div class="control-panel">
    <div class="panel-title">⚡ แผงควบคุมระบบลงคะแนนจำลอง</div>

    <!-- v2: จัดการรายชื่อแคนดิเดต -->
    <div class="panel-title" id="modeTitle"></div>
    <div class="panel-row" id="candidateChips"></div>
    <div class="panel-row">
        <input class="add-input" id="newCandidate" type="text" placeholder="พิมพ์ชื่อแคนดิเดตใหม่ แล้วกด Enter" onkeydown="if(event.key==='Enter')addCandidate()">
        <button class="btn btn-nav btn-sm" onclick="addCandidate()">➕ เพิ่มแคนดิเดต</button>
    </div>

    <div class="divider"></div>

    <div class="panel-row" id="voteButtons"></div>
    <div class="panel-row">
        <button class="btn btn-nav" id="btnPrev" onclick="changeMember(-1)">⏮️ รายชื่อก่อนหน้า</button>
        <button class="btn btn-nav" id="btnNext" onclick="changeMember(1)">รายชื่อถัดไป ⏭️</button>
    </div>

    <div class="divider"></div>
    <div class="panel-title" id="srcStatus"></div>
    <div class="panel-row">
        <button class="btn btn-nav btn-sm" onclick="loadMembers()">🔄 โหลดรายชื่อจากชีตใหม่</button>
        <button class="btn btn-nav btn-sm" onclick="document.getElementById('csvFile').click()">📂 เลือกไฟล์ CSV</button>
        <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" hidden onchange="loadFile(this)">
    </div>
    <details style="width:100%">
        <summary class="panel-title" style="cursor:pointer">📋 วางรายชื่อเอง (บรรทัดละ ๑ คน)</summary>
        <textarea id="pasteBox" rows="5" style="width:100%;font-family:inherit;font-size:16px;margin-top:8px;padding:8px"></textarea>
        <div class="panel-row" style="margin-top:8px"><button class="btn btn-nav btn-sm" onclick="loadPasted()">ใช้รายชื่อนี้</button></div>
    </details>

    <div class="divider"></div>
    <div class="tally" id="tally"></div>
    <div class="panel-row">
        <button class="btn btn-clear btn-sm" onclick="resetAll()">🔄 รีเซ็ตผลลงมติทั้งหมด</button>
    </div>
</div>

<script>
// ===== ตั้งค่าแหล่งข้อมูล =====
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSUypZwjIz1tNUGjfivW9jICVqMG__aTadyomBD8qnQCpefBxaYQXXO-bgEg6-pduMJ-v_3Vd2e2P66/pub?output=csv";
const NAME_COL = 2;
const POSITION_COL = 1;
const POSITION_FILTER = "สภาผู้แทนราษฎร";

let membersList = [];
let currentIndex = 0;

// ===== v2: แคนดิเดต =====
// ถ้ามีแคนดิเดต 1 คน  -> ปุ่ม เห็นด้วย / ไม่เห็นด้วย / งดออกเสียง
// ถ้ามีแคนดิเดตหลายคน -> ปุ่มเป็นชื่อแคนดิเดต (เลือกได้ 1 คน/สมาชิก) + งดออกเสียง
// votes[memberIndex] = {k:'a'|'d'|'b'} หรือ {k:'c', id:<candidateId>}
let candidates = [{ id: 1, name: "แคนดิเดตคนที่ ๑" }];
let nextId = 2;
let votes = {};
const PALETTE = ["#0E29A8", "#D3434B", "#0A7F5A", "#8E44AD", "#D35400", "#16808D"];

function toThaiNum(n) { return String(n).replace(/\d/g, d => "๐๑๒๓๔๕๖๗๘๙"[d]); }
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function isMulti() { return candidates.length > 1; }
function candColor(id) { const i = candidates.findIndex(c => c.id === id); return PALETTE[i % PALETTE.length]; }

function save() {
    try { localStorage.setItem("pmVoteV2b", JSON.stringify({ candidates, nextId, votes, currentIndex })); } catch (e) {}
}
function restore() {
    try {
        const d = JSON.parse(localStorage.getItem("pmVoteV2b") || "null");
        if (d && Array.isArray(d.candidates) && d.candidates.length) {
            candidates = d.candidates; nextId = d.nextId; votes = d.votes || {}; currentIndex = d.currentIndex || 0;
        }
    } catch (e) {}
}

function addCandidate() {
    const input = document.getElementById('newCandidate');
    const name = input.value.replace(/\s+/g, " ").trim();
    if (!name) return;
    candidates.push({ id: nextId++, name });
    input.value = "";
    updateDisplay();
}
function renameCandidate(id) {
    const c = candidates.find(x => x.id === id);
    const name = prompt("แก้ไขชื่อแคนดิเดต", c.name);
    if (name && name.trim()) { c.name = name.replace(/\s+/g, " ").trim(); updateDisplay(); }
}
function removeCandidate(id) {
    if (candidates.length <= 1) { alert("ต้องมีแคนดิเดตอย่างน้อย ๑ คน"); return; }
    const c = candidates.find(x => x.id === id);
    if (!confirm("ลบ \"" + c.name + "\" ? (คะแนนที่ลงให้แคนดิเดตนี้จะถูกล้าง)")) return;
    candidates = candidates.filter(x => x.id !== id);
    Object.keys(votes).forEach(k => { if (votes[k].k === 'c' && votes[k].id === id) delete votes[k]; });
    updateDisplay();
}
function resetAll() {
    if (!confirm("รีเซ็ตผลลงมติของสมาชิกทุกคน?")) return;
    votes = {};
    updateDisplay();
}

// แปลงคะแนนที่เก็บไว้ -> ข้อความ/สี ตามโหมดปัจจุบัน (โหมดไม่ตรงจะไม่แสดง)
function voteView(v) {
    if (!v) return { text: '', color: '' };
    if (v.k === 'b') return { text: 'งดออกเสียง', color: '#7F7F7F' };
    if (isMulti()) {
        if (v.k !== 'c') return { text: '', color: '' };
        const c = candidates.find(x => x.id === v.id);
        return c ? { text: c.name, color: candColor(c.id) } : { text: '', color: '' };
    }
    if (v.k === 'a') return { text: 'เห็นด้วย', color: '#008000' };
    if (v.k === 'd') return { text: 'ไม่เห็นด้วย', color: '#FF0000' };
    return { text: '', color: '' };
}

// ===== CSV =====
function parseCSV(text) {
    const rows = []; let row = [], cell = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
            if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
            else if (c === '"') inQuotes = false;
            else cell += c;
        } else if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(cell); cell = ""; }
        else if (c === "\n" || c === "\r") {
            if (c === "\r" && text[i + 1] === "\n") i++;
            row.push(cell); rows.push(row); row = []; cell = "";
        } else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
}

const CACHE_KEY = "pmMembersCacheV2";
function setStatus(t) { document.getElementById('srcStatus').innerText = t; }

function namesFromRows(rows) {
    const seen = new Set(), names = [];
    rows.forEach(r => {
        const name = (r[NAME_COL] || "").replace(/\s+/g, " ").trim();
        const pos = (r[POSITION_COL] || "").trim();
        if (!name || seen.has(name)) return;
        if (POSITION_FILTER && !pos.includes(POSITION_FILTER)) return;
        seen.add(name); names.push(name);
    });
    return names;
}

function setNames(names, statusText, saveCache) {
    const sortKey = n => n.replace(/^(นางสาว|นาง|นาย|พล\.?\s?อ\.?|ดร\.?)\s*/, "");
    const sorted = names.slice().sort((a, b) => sortKey(a).localeCompare(sortKey(b), "th"));
    membersList = sorted.map((n, i) => toThaiNum(i + 1) + ". " + n);
    if (currentIndex >= membersList.length) currentIndex = 0;
    if (saveCache) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(sorted)); } catch (e) {} }
    setStatus(statusText + " (" + membersList.length + " รายชื่อ)");
    updateDisplay();
}

async function fetchCSV() {
    let last;
    for (const u of [CSV_URL, CSV_URL + "&t=" + Date.now()]) {
        try {
            const res = await fetch(u, { cache: "no-store" });
            if (!res.ok) throw new Error("HTTP " + res.status);
            return await res.text();
        } catch (e) { last = e; }
    }
    throw last;
}

async function loadMembers() {
    const nameEl = document.getElementById('memberName');
    setStatus("กำลังโหลดรายชื่อจากชีต...");
    try {
        const names = namesFromRows(parseCSV(await fetchCSV()).slice(1));
        if (names.length === 0) throw new Error("ไม่พบรายชื่อ");
        setNames(names, "โหลดจากชีตสำเร็จ", true);
    } catch (err) {
        console.error("โหลดรายชื่อไม่สำเร็จ:", err);
        let cached = null;
        try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch (e) {}
        if (cached && cached.length) {
            setNames(cached, "โหลดจากชีตไม่ได้ ใช้รายชื่อที่บันทึกไว้ล่าสุดแทน", false);
        } else {
            nameEl.innerText = "โหลดรายชื่อไม่สำเร็จ";
            setStatus("โหลดจากชีตไม่ได้ — เลือกไฟล์ CSV หรือวางรายชื่อด้านล่างแทน");
            updateDisplay();
        }
    }
}

function loadFile(input) {
    const f = input.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
        const names = namesFromRows(parseCSV(String(rd.result).replace(/^\uFEFF/, "")).slice(1));
        if (!names.length) { alert("ไม่พบรายชื่อในไฟล์ (ตรวจคอลัมน์ชื่อ/ตำแหน่ง)"); return; }
        setNames(names, "โหลดจากไฟล์ " + f.name, true);
    };
    rd.readAsText(f, "UTF-8");
    input.value = "";
}

function loadPasted() {
    const seen = new Set();
    const names = document.getElementById('pasteBox').value.split(/\r?\n/)
        .map(x => x.replace(/^\s*[\d๐-๙]+[.)]\s*/, "").replace(/\s+/g, " ").trim())
        .filter(x => x && !seen.has(x) && seen.add(x));
    if (!names.length) { alert("ยังไม่ได้พิมพ์รายชื่อ"); return; }
    setNames(names, "ใช้รายชื่อที่วางเอง", true);
}

// ===== แสดงผล =====
function renderCandidates() {
    document.getElementById('modeTitle').innerText = isMulti()
        ? "👤 รายชื่อแคนดิเดตนายกรัฐมนตรี (สมาชิกเลือกได้ ๑ คน)"
        : "👤 แคนดิเดตนายกรัฐมนตรี (เพิ่มแคนดิเดตเพื่อเปลี่ยนเป็นโหมดเลือกชื่อ)";
    document.getElementById('candidateChips').innerHTML = candidates.map(c =>
        `<span class="cand-tag" style="border-color:${candColor(c.id)};color:${candColor(c.id)}">${esc(c.name)}
            <button title="แก้ชื่อ" onclick="renameCandidate(${c.id})">✏️</button>
            <button title="ลบ" onclick="removeCandidate(${c.id})">✕</button></span>`
    ).join("");
    document.querySelector('.main-title').style.marginBottom = '35px';
}

function renderVoteButtons() {
    let h = '';
    if (isMulti()) {
        h += candidates.map(c => `<button class="btn btn-cand" style="background:${candColor(c.id)}" onclick="voteCandidate(${c.id})">${esc(c.name)}</button>`).join('');
    } else {
        h += `<button class="btn btn-agree" onclick="castVote('a')">เห็นด้วย</button>
              <button class="btn btn-disagree" onclick="castVote('d')">ไม่เห็นด้วย</button>`;
    }
    h += `<button class="btn btn-abstain" onclick="castVote('b')">งดออกเสียง</button>
          <button class="btn btn-clear" onclick="castVote('')">ล้างคำตอบ</button>`;
    document.getElementById('voteButtons').innerHTML = h;
}

function renderTally() {
    const all = Object.values(votes).map(voteView).filter(x => x.text);
    const count = t => all.filter(x => x.text === t).length;
    let h = '';
    if (isMulti()) {
        h += candidates.map(c => `<span style="color:${candColor(c.id)}">${esc(c.name)} ${count(c.name)}</span>`).join('');
    } else {
        h += `<span class="a">เห็นด้วย ${count('เห็นด้วย')}</span><span class="d">ไม่เห็นด้วย ${count('ไม่เห็นด้วย')}</span>`;
    }
    h += `<span class="b">งดออกเสียง ${count('งดออกเสียง')}</span><span class="n">ลงมติแล้ว ${all.length}/${membersList.length}</span>`;
    document.getElementById('tally').innerHTML = h;
}

function updateDisplay() {
    renderCandidates();
    renderVoteButtons();
    renderTally();
    if (membersList.length === 0) { save(); return; }
    document.getElementById('memberName').innerText = membersList[currentIndex];
    const view = voteView(votes[currentIndex]);
    const r = document.getElementById('voteResult');
    r.innerText = view.text;
    r.style.color = view.color;
    document.getElementById('btnPrev').disabled = (currentIndex === 0);
    document.getElementById('btnNext').disabled = (currentIndex === membersList.length - 1);
    save();
}

function castVote(k) {
    if (membersList.length === 0) return;
    if (k) votes[currentIndex] = { k }; else delete votes[currentIndex];
    updateDisplay();
}
function voteCandidate(id) {
    if (membersList.length === 0) return;
    votes[currentIndex] = { k: 'c', id };
    updateDisplay();
}

function changeMember(dir) {
    if (membersList.length === 0) return;
    currentIndex += dir;
    updateDisplay();
}

// คีย์ลัด: ←/→ เลื่อนรายชื่อ, 1-9 = เลือกตัวเลือกที่ n (แคนดิเดตหรือเห็นด้วย/ไม่เห็นด้วย), B = งดออกเสียง, 0 = ล้าง
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' && currentIndex < membersList.length - 1) changeMember(1);
    else if (e.key === 'ArrowLeft' && currentIndex > 0) changeMember(-1);
    else if (e.key === '0') castVote('');
    else if (e.key.toLowerCase() === 'b') castVote('b');
    else if (/^[1-9]$/.test(e.key)) {
        const n = +e.key - 1;
        if (isMulti()) { if (candidates[n]) voteCandidate(candidates[n].id); }
        else if (n === 0) castVote('a'); else if (n === 1) castVote('d');
    }
});

restore();
renderCandidates();
loadMembers();
</script>
</body>
</html>
